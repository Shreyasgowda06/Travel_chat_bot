<div class="absolute inset-0 bg-gradient-to-b from-surface/40 via-surface/10 to-surface/90"></div>

<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-4 h-16 bg-surface/80 dark:bg-surface-dim/80 backdrop-blur-md shadow-[0_4px_16px_rgba(31,41,55,0.08)]">

<span class="material-symbols-outlined" data-icon="menu">menu</span>

<div class="w-10 h-10 rounded-full bg-surface-variant overflow-hidden border border-outline-variant/30 flex items-center justify-center text-primary">
<span class="material-symbols-outlined" data-icon="person">person</span>
</div>

<!-- Main Content Canvas (Search Focus Area) -->
<main class="flex-1 w-full max-w-3xl mx-auto z-10 relative flex flex-col overflow-y-auto justify-start pb-32 pt-20 px-gutter"></main>
<!-- Search Input Area (Bottom Fixed) -->
<div class="fixed bottom-20 left-0 w-full z-40 px-gutter pb-4">
<div class="max-w-3xl mx-auto relative">
<div class="glass-panel rounded-full shadow-[0_4px_24px_rgba(0,101,145,0.15)] flex items-center p-2 border border-primary-container/50 focus-within:border-primary focus-within:ring-2 focus-within:ring-primary/20 transition-all">
<span class="material-symbols-outlined text-primary pl-3 pr-2" data-icon="search">search</span>
<input autofocus="" class="flex-1 bg-transparent border-none focus:ring-0 text-body-lg font-body-lg text-on-surface placeholder:text-on-surface-variant/50 py-3 px-2 outline-none" placeholder="Where to next?" type="text"/>
<div class="flex items-center gap-1 pr-2">
<button class="p-2 text-on-surface-variant hover:text-primary hover:bg-surface-container rounded-full transition-colors">
<span class="material-symbols-outlined" data-icon="mic">mic</span>
</button>
<button class="p-2 text-on-surface-variant hover:text-primary hover:bg-surface-container rounded-full transition-colors hidden md:block">
<span class="material-symbols-outlined" data-icon="send">send</span>
</button>
</div>
</div>
<!-- Fake Cursor Line for structural indication if needed -->
<div class="absolute left-14 top-1/2 -translate-y-1/2 w-[2px] h-6 bg-primary animate-pulse pointer-events-none"></div>
</div>
</div>
<!-- BottomNavBar (Suppressed due to Search/Active Input State Focus, but keeping structure hidden for transition logic if required by rules, otherwise removed as per 'Semantic Shell Mandate' for focused/transactional intent. User is focused on inputting a search.) -->
<!-- Applying Contextual Suppression: Hidden during active search typing -->

<script>
    const input = document.querySelector('input[type="text"]');
    const sendBtn = document.querySelector('[data-icon="send"]').parentElement;
    const mainContainer = document.querySelector('main');
    
    // Change mic to attach_file for upload
    const micIcon = document.querySelector('[data-icon="mic"]');
    if (micIcon) {
        micIcon.innerText = 'attach_file';
        micIcon.setAttribute('data-icon', 'attach_file');
    }
    const uploadBtn = micIcon ? micIcon.parentElement : null;
    
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*,.pdf';
    fileInput.style.display = 'none';
    document.body.appendChild(fileInput);
    
    let stagedFile = null;
    let conversationHistory = [];
    
    const inputWrapper = input.parentElement;
    const fileBadge = document.createElement('div');
    fileBadge.className = 'absolute -top-8 left-4 bg-surface-variant text-on-surface-variant text-xs px-2 py-1 rounded-md hidden shadow-sm cursor-pointer border border-outline-variant/30';
    inputWrapper.parentElement.appendChild(fileBadge);
    
    if (uploadBtn) {
        uploadBtn.addEventListener('click', () => fileInput.click());
    }
    
    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
            stagedFile = e.target.files[0];
            fileBadge.innerText = stagedFile.name + " (Click to remove)";
            fileBadge.style.display = 'block';
        }
        updateSendState();
    });
    
    fileBadge.addEventListener('click', () => {
        stagedFile = null;
        fileInput.value = '';
        fileBadge.style.display = 'none';
        updateSendState();
    });

    function updateSendState() {
        sendBtn.disabled = input.value.trim().length === 0 && !stagedFile;
        sendBtn.style.opacity = sendBtn.disabled ? '0.5' : '1';
    }
    input.addEventListener('input', updateSendState);
    updateSendState();
    
    function appendBubble(role, text, isError=false) {
        const bubble = document.createElement('div');
        bubble.className = "p-4 rounded-2xl shadow-sm max-w-[85%] animate-[slideUp_0.3s_ease-out] ";
        
        if (role === 'user') {
            bubble.className += "bg-primary text-on-primary self-end ml-auto rounded-br-sm";
            bubble.innerText = text;
        } else {
            if (isError) {
                bubble.className += "bg-error-container text-error self-start mr-auto rounded-bl-sm";
                bubble.innerText = text; // Don't parse markdown for errors
            } else {
                bubble.className += "glass-panel text-on-surface self-start mr-auto rounded-bl-sm border border-surface-variant/50 prose prose-sm max-w-none prose-headings:text-on-surface prose-a:text-primary";
                bubble.innerHTML = marked.parse(text);
            }
        }
        
        const row = document.createElement('div');
        row.className = "w-full flex mb-4";
        row.appendChild(bubble);
        mainContainer.appendChild(row);
        
        mainContainer.scrollTo({ top: mainContainer.scrollHeight, behavior: 'smooth' });
        return bubble;
    }
    
    function appendTypingIndicator() {
        const bubble = document.createElement('div');
        bubble.className = "glass-panel text-on-surface p-4 rounded-2xl shadow-sm max-w-[85%] self-start mr-auto rounded-bl-sm border border-surface-variant/50 mb-4 animate-[slideUp_0.3s_ease-out]";
        bubble.innerHTML = '<div class="flex gap-1 items-center h-6"><div class="w-2 h-2 bg-on-surface-variant rounded-full animate-bounce"></div><div class="w-2 h-2 bg-on-surface-variant rounded-full animate-bounce" style="animation-delay: 0.2s"></div><div class="w-2 h-2 bg-on-surface-variant rounded-full animate-bounce" style="animation-delay: 0.4s"></div></div>';
        
        const row = document.createElement('div');
        row.className = "w-full flex mb-4 typing-row";
        row.appendChild(bubble);
        mainContainer.appendChild(row);
        mainContainer.scrollTo({ top: mainContainer.scrollHeight, behavior: 'smooth' });
        return row;
    }

    async function sendMessage() {
        if (sendBtn.disabled) return;
        
        const text = input.value.trim();
        const file = stagedFile;
        
        input.value = '';
        stagedFile = null;
        fileInput.value = '';
        fileBadge.style.display = 'none';
        updateSendState();
        
        if (text || file) {
            let userText = text;
            if (file) {
                userText = `[Attached File: ${file.name}] ` + text;
            }
            appendBubble('user', userText);
            
            if (!file) {
                conversationHistory.push({role: "user", parts: [text]});
            }
        }
        
        const typingRow = appendTypingIndicator();
        
        try {
            let res;
            if (file) {
                const formData = new FormData();
                formData.append('prompt', text || 'Describe this file');
                formData.append('image', file);
                
                res = await fetch('/vision', {
                    method: 'POST',
                    body: formData
                });
            } else {
                res = await fetch('/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({messages: conversationHistory})
                });
            }
            
            const data = await res.json();
            typingRow.remove();
            
            if (!res.ok) {
                throw new Error(data.reply || data.detail || "Server error");
            }
            
            appendBubble('model', data.reply);
            
            if (!file) {
                conversationHistory.push({role: "model", parts: [data.reply]});
            }
        } catch (err) {
            typingRow.remove();
            appendBubble('model', err.message, true);
        }
    }
    
    sendBtn.addEventListener('click', sendMessage);
    input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            sendMessage();
        }
    });

</script>
</body>
